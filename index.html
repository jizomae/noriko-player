<html lang="ja">
<head>

  <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>
  <style>

    .bar{height:10px;background:rgba(255,255,255,.34);border-radius:999px;overflow:hidden;cursor:pointer}
    .fill{height:100%;width:0%;background:#fff;border-radius:999px}
    #waveCanvas{width:100%;height:70px;margin-top:10px;background:rgba(0,0,0,.32);border-radius:12px;display:block;cursor:pointer;border:1px solid rgba(255,255,255,.14)}
    body.cleanMode #waveCanvas,
    body.cleanMode .progress {display:none!important}

    body.cleanMode .now{width:min(900px,calc(100vw - 48px));grid-template-columns:96px minmax(0,1fr);opacity:.86;padding:14px 18px}
    body.cleanMode .art{width:96px;height:96px}
    body.cleanMode .brand{opacity:.4}
    body.cleanMode .shade{background:radial-gradient(circle at center,rgba(0,0,0,.02),rgba(0,0,0,.52)),linear-gradient(to top,rgba(0,0,0,.58),rgba(0,0,0,.02) 50%,rgba(0,0,0,.18))}

    .next{margin-top:10px;font-size:15px;font-weight:900;text-shadow:0 2px 8px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    }

<body>
  <video id="bgVideo" src="videos/djnorikoloop.mp4" muted loop playsinline></video>
  <canvas id="vjCanvas"></canvas>
  <div class="shade"></div>

  <main class="app">

          </div>

          <div class="settings">

            <button id="shuffleBtn" class="secondary" disabled>SHUFFLE</button>

            <button id="vjBtn" class="secondary active">VJ FX</button>

            <button id="fullscreenBtn" class="secondary">FULL</button>
            <button id="listBtn" class="secondary" disabled>SETLIST</button>
          </div>
          <div class="status" id="status">MP3フォルダを読み込んでください。NORIKO動画は videos フォルダから選択します。v2.6.2</div>
          <div class="status">
            SHORTCUT: SPACE PLAY / 1-4 動画切替 / A -10s / D +10s / W 前曲 / S 次曲 / M MENU / TAB CLEAN / L VJ / K SHAKE / F FULL / ESC FULL解除

        </div>
        <div class="controls">
          <button id="minBtn" class="secondary">MIN</button>
        </div>
      </div>
    </section>

    <section class="now">
      <img id="artwork" class="art" alt="Artwork" />
      <div>
        <div class="eyebrow" id="eyebrow">NOW WAITING</div>
        <div class="titleWrap"><div class="title" id="title">DJ NORIKO PLAYER</div></div>
        <div class="artist" id="artist">Load your MP3 folder</div>
        <div class="progress">
          <span id="currentTime">0:00</span>
          <div class="bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
          <span id="duration">0:00</span>
        </div>
        <canvas id="waveCanvas" width="900" height="110"></canvas>
        <div class="next" id="nextInfo">NEXT: -</div>
      </div>
    </section>
  </main>

  <aside class="playlist" id="playlist"></aside>

<script>
const $ = id => document.getElementById(id);
const bgVideo=$('bgVideo'), vjCanvas=$('vjCanvas'), panel=$('panel'), minBtn=$('minBtn'), musicInput=$('musicInput'), musicName=$('musicName');
const playBtn=$('playBtn'), prevBtn=$('prevBtn'), nextBtn=$('nextBtn'), backBtn=$('backBtn'), forwardBtn=$('forwardBtn'), shuffleBtn=$('shuffleBtn'), loopBtn=$('loopBtn'), analyzeBtn=$('analyzeBtn'), autoCamBtn=$('autoCamBtn'), vjBtn=$('vjBtn'), shakeBtn=$('shakeBtn'), fullscreenBtn=$('fullscreenBtn'), listBtn=$('listBtn');
const norikoVideoSelect=$('norikoVideoSelect'), playerTitleInput=$('playerTitleInput'), brandTitle=$('brandTitle'), defaultMixBars=$('defaultMixBars');
const statusEl=$('status'), artworkEl=$('artwork'), eyebrowEl=$('eyebrow'), titleEl=$('title'), artistEl=$('artist'), currentTimeEl=$('currentTime'), durationEl=$('duration'), progressBar=$('progressBar'), progressFill=$('progressFill'), nextInfo=$('nextInfo'), playlistEl=$('playlist'), waveCanvas=$('waveCanvas');
const wctx = waveCanvas.getContext('2d');
const vctx = vjCanvas.getContext('2d');

let tracks=[], currentIndex=-1, audioContext=null, currentSource=null, currentGain=null, nextSource=null, nextGain=null;
let startedAt=0, pausedAt=0, isPlaying=false, rafId=null, crossfadeStarted=false, shuffleMode=false, loopMode=true, dragIndex=null, forceNoCrossfade=false;
let playSessionId = 0;
let crossfadeTimer = null;
let analyser = null;
let freqData = null;
let vjEnabled = true;
let shakeEnabled = true;
let beatPulse = 0;
let bassEnergy = 0;
let midEnergy = 0;
let lastBeatAt = 0;
let vjPhase = 0;
let vjMode = 0;
let nextVjSwitchAt = performance.now() + 38000;
let bassHistory = [];
let focusables=[];
let focusPos=0;
let cleanMode=false;
let autoCamMode=true;
let autoCamTimer=null;
let lastManualCamAt=0;
const autoCamSequence=[0,1,2,0,3,1];
let autoCamStep=0;

const defaultSvg=encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#190004"/><stop offset="1" stop-color="#8c0010"/></linearGradient></defs><rect width="600" height="600" fill="url(#g)"/><circle cx="300" cy="260" r="128" fill="none" stroke="#fff" stroke-width="12" opacity=".8"/><rect x="190" y="330" width="220" height="38" rx="19" fill="#fff" opacity=".85"/><text x="300" y="455" font-size="42" text-anchor="middle" font-family="Arial" fill="#fff" font-weight="900">DJ NORIKO</text></svg>`);
artworkEl.src=`data:image/svg+xml;charset=utf-8,${defaultSvg}`;
bgVideo.play().catch(()=>{});

norikoVideoSelect.addEventListener('change',()=>{ bgVideo.src=norikoVideoSelect.value; bgVideo.play().catch(()=>{}); });
defaultMixBars.addEventListener('change',()=>{
  tracks.forEach(t=>{ t.mixBars = defaultMixBars.value; });
  renderPlaylist();
  updateNextInfo();
  statusEl.textContent = `デフォルトMIXを ${defaultMixBars.value === '0' ? '繋がない' : defaultMixBars.value + '小節'} に反映しました。`;
});
playerTitleInput.addEventListener('input',()=>{ brandTitle.textContent=playerTitleInput.value || 'DJ NORIKO'; });
minBtn.addEventListener('click',()=>toggleMenu());
listBtn.addEventListener('click',()=>playlistEl.classList.toggle('show'));
fullscreenBtn.addEventListener('click',async()=>toggleFullscreen());
shuffleBtn.addEventListener('click',()=>{shuffleMode=!shuffleMode;shuffleBtn.classList.toggle('active',shuffleMode);updateNextInfo();});
loopBtn.addEventListener('click',()=>{loopMode=!loopMode;loopBtn.classList.toggle('active',loopMode);updateNextInfo();});

autoCamBtn.classList.toggle('active', autoCamMode);
autoCamBtn.addEventListener('click',()=>{
  autoCamMode=!autoCamMode;
  autoCamBtn.classList.toggle('active',autoCamMode);
  if(autoCamMode) startAutoCam(); else stopAutoCam();
  statusEl.textContent = autoCamMode ? 'AUTO CAM ON。配信中にNORIKO動画を控えめに自動切替します。' : 'AUTO CAM OFF。1〜4の手動切替のみです。';
});
startAutoCam();

vjBtn.addEventListener('click',()=>{
  vjEnabled=!vjEnabled;
  vjBtn.classList.toggle('active',vjEnabled);
  if(!vjEnabled) clearVj();
  statusEl.textContent = vjEnabled ? 'VJ FX ON。少し強めのクラブ照明効果を重ねます。' : 'VJ FX OFF。';
});

shakeBtn.addEventListener('click',()=>{
  shakeEnabled=!shakeEnabled;
  shakeBtn.classList.toggle('active',shakeEnabled);
  if(!shakeEnabled) bgVideo.style.transform='scale(1)';
  statusEl.textContent = shakeEnabled ? 'SHAKE ON。低音に合わせて控えめに映像が揺れます。' : 'SHAKE OFF。';
});

musicInput.addEventListener('change', async()=>{
  const files=Array.from(musicInput.files||[]).filter(f=>f.type.includes('audio')||f.name.toLowerCase().endsWith('.mp3'));
  if(!files.length)return;
  musicName.textContent=`${files.length}曲`;
  statusEl.textContent='MP3タグを読み込み中...';
  tracks=await Promise.all(files.map(readTrack));
  tracks.sort((a,b)=>a.path.localeCompare(b.path,'ja',{numeric:true}));
  const def=defaultMixBars.value;
  tracks.forEach(t=>t.mixBars=def);
  currentIndex=tracks.length?0:-1;
  renderPlaylist(); updateNowInfo(currentIndex); updateReadyState();
  statusEl.textContent=`${tracks.length}曲を読み込みました。必要ならBPM ANALYZEを実行してください。`;
});

async function readTrack(file){
  const basic={file,path:file.webkitRelativePath||file.name,title:file.name.replace(/\.mp3$/i,''),artist:'Unknown Artist',artwork:`data:image/svg+xml;charset=utf-8,${defaultSvg}`,duration:0,buffer:null,bpm:'',mixBars:(defaultMixBars ? defaultMixBars.value : '2'),wave:null};
  await new Promise(resolve=>{
    window.jsmediatags.read(file,{
      onSuccess:tag=>{
        const tags=tag.tags||{};
        basic.title=tags.title||basic.title; basic.artist=tags.artist||basic.artist;
        basic.bpm=tags.TBPM||tags.bpm||tags.BPM||'';
        if(tags.picture){
          const {data,format}=tags.picture; let binary='';
          for(let i=0;i<data.length;i++) binary+=String.fromCharCode(data[i]);
          basic.artwork=`data:${format};base64,${btoa(binary)}`;
        }
        resolve();
      },
      onError:()=>resolve()
    });
  });
  return basic;
}
function updateReadyState(){const r=tracks.length>0; [playBtn,prevBtn,nextBtn,backBtn,forwardBtn,shuffleBtn,loopBtn,analyzeBtn,listBtn].forEach(b=>b.disabled=!r);}
async function ensureAudio(){
  if(!audioContext) audioContext=new AudioContext();
  if(!analyser){
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.82;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    analyser.connect(audioContext.destination);
  }
  if(audioContext.state==='suspended') await audioContext.resume();
}
async function getBuffer(track){ if(track.buffer)return track.buffer; const ab=await track.file.arrayBuffer(); track.buffer=await audioContext.decodeAudioData(ab.slice(0)); track.duration=track.buffer.duration; if(!track.wave) track.wave=makeWaveData(track.buffer, 900); return track.buffer; }
function releaseUnusedBuffers(...keep){ const s=new Set(keep.filter(i=>i>=0)); tracks.forEach((t,i)=>{ if(!s.has(i)) t.buffer=null; }); }

playBtn.addEventListener('click',async()=>{ if(!tracks.length)return; bgVideo.play().catch(()=>{}); await ensureAudio(); if(isPlaying)pauseCurrent(); else await playTrack(currentIndex<0?0:currentIndex,pausedAt); });
prevBtn.addEventListener('click',async()=>{ if(!tracks.length)return; await ensureAudio(); forceNoCrossfade=true; await skipToPrev(true); });
nextBtn.addEventListener('click',async()=>{ if(!tracks.length)return; await ensureAudio(); forceNoCrossfade=true; await skipToNext(true); });
backBtn.addEventListener('click',async()=>seekRelative(-10));
forwardBtn.addEventListener('click',async()=>seekRelative(10));
progressBar.addEventListener('click',e=>seekByClick(e, progressBar));
waveCanvas.addEventListener('click',e=>seekByClick(e, waveCanvas));

async function playTrack(index, offset=0){
  const session = ++playSessionId;
  stopSources();
  currentIndex=normalizeIndex(index);
  const track=tracks[currentIndex];
  const buffer=await getBuffer(track);
  if (session !== playSessionId) return;
  track.duration=buffer.duration;
  releaseUnusedBuffers(currentIndex);

  currentSource=audioContext.createBufferSource();
  currentGain=audioContext.createGain();
  currentSource.buffer=buffer; currentGain.gain.value=1;
  currentSource.connect(currentGain).connect(analyser || audioContext.destination);
  startedAt=audioContext.currentTime-offset; pausedAt=offset; isPlaying=true; crossfadeStarted=false; forceNoCrossfade=false;
  currentSource.start(0,offset);
  currentSource.onended=()=>{ if(session===playSessionId && isPlaying&&!crossfadeStarted) skipToNext(false); };
  playBtn.textContent='PAUSE'; titleEl.classList.add('playing'); updateNowInfo(currentIndex); tick();
}
function pauseCurrent(){ if(!isPlaying)return; pausedAt=Math.max(0,audioContext.currentTime-startedAt); stopSources(false); isPlaying=false; playBtn.textContent='PLAY'; titleEl.classList.remove('playing'); clearVj(); cancelAnimationFrame(rafId); }
function stopSources(resetPause=true){
  if (crossfadeTimer) {
    clearTimeout(crossfadeTimer);
    crossfadeTimer = null;
  }
  [currentSource,nextSource].forEach(s=>{
    try {
      if (s) {
        s.onended = null;
        s.stop();
        s.disconnect();
      }
    } catch(e) {}
  });
  try { if(currentGain) currentGain.disconnect(); } catch(e) {}
  try { if(nextGain) nextGain.disconnect(); } catch(e) {}
  currentSource=null;nextSource=null;currentGain=null;nextGain=null;crossfadeStarted=false;
  if(resetPause)pausedAt=0; cancelAnimationFrame(rafId);
}
async function skipToNext(manual){
  const ni=getNextIndex(); if(ni===-1){stopAtEnd();return;}
  await playTrack(ni,0); if(manual)statusEl.textContent='次の曲へスキップしました。';
}
async function skipToPrev(manual){
  if(!tracks.length)return;
  let pi = currentIndex - 1;
  if(pi < 0) pi = loopMode ? tracks.length - 1 : 0;
  await playTrack(pi,0);
  if(manual)statusEl.textContent='前の曲へ戻りました。';
}
function stopAtEnd(){stopSources();isPlaying=false;playBtn.textContent='PLAY';titleEl.classList.remove('playing');eyebrowEl.textContent='PLAYBACK ENDED';clearVj();statusEl.textContent='セットリストの最後まで再生しました。';}
function getNextIndex(){
  if(!tracks.length)return-1; if(tracks.length===1)return loopMode?currentIndex:-1;
  if(shuffleMode){let c=currentIndex,g=0;while(c===currentIndex&&g<20){c=Math.floor(Math.random()*tracks.length);g++;}return c;}
  const n=currentIndex+1; if(n<tracks.length)return n; return loopMode?0:-1;
}
function getMixSeconds(track){
  if(!track || track.mixBars==='0') return 0;
  const bpm=Number(track.bpm), bars=Number(track.mixBars)||2;
  if(!bpm || bpm<40 || bpm>240) return bars===2?4:8;
  return clamp((60/bpm)*4*bars, 1, 30);
}
async function startCrossfade(){
  const session = playSessionId;
  if(crossfadeStarted||tracks.length<2||forceNoCrossfade)return;
  const cur=tracks[currentIndex], mixSeconds=getMixSeconds(cur);
  if(mixSeconds<=0) return;
  const ni=getNextIndex(); if(ni===-1)return;
  crossfadeStarted=true;
  const nextTrack=tracks[ni], nextBuffer=await getBuffer(nextTrack);
  if (session !== playSessionId) return;
  releaseUnusedBuffers(currentIndex,ni);
  nextSource=audioContext.createBufferSource(); nextGain=audioContext.createGain();

  currentGain.gain.cancelScheduledValues(now);
  currentGain.gain.setValueAtTime(currentGain.gain.value,now);
  currentGain.gain.linearRampToValueAtTime(0,now+mixSeconds);
  nextGain.gain.linearRampToValueAtTime(1,now+mixSeconds);
  nextSource.start(0,0);
  nextSource.onended=()=>{if(session===playSessionId && isPlaying&&!crossfadeStarted)skipToNext(false);};
  eyebrowEl.textContent='MIXING NEXT UP'; statusEl.textContent=`クロスフェード中: ${nextTrack.title} / ${mixSeconds.toFixed(1)}秒`;
  crossfadeTimer = setTimeout(()=>{
    if (session !== playSessionId) return;
    try{
      if(currentSource){
        currentSource.onended = null;
        currentSource.stop();
        currentSource.disconnect();

    }catch(e){}

}
function tick(){
  if(!isPlaying||!tracks[currentIndex])return;

async function estimateBpm(track){
  const buf=await getBuffer(track), data=buf.getChannelData(0), sr=buf.sampleRate;
  const hop=Math.floor(sr*0.05), frames=Math.floor(data.length/hop), env=new Float32Array(frames);
  for(let i=0;i<frames;i++){
    let sum=0,start=i*hop,end=Math.min(data.length,start+hop);
    for(let j=start+1;j<end;j++){ const d=data[j]-data[j-1]; if(d>0)sum+=d; }
    env[i]=sum/(end-start);
  }
  let mean=0; for(const v of env)mean+=v; mean/=env.length;
  for(let i=0;i<env.length;i++)env[i]=Math.max(0,env[i]-mean);
  let bestBpm=120,best=-1;
  for(let bpm=60;bpm<=190;bpm++){
    const lag=Math.round((60/bpm)/0.05);
    let score=0;
    for(let i=lag;i<env.length;i++)score+=env[i]*env[i-lag];
    if(score>best){best=score;bestBpm=bpm;}
  }
  while(bestBpm<85)bestBpm*=2;
  while(bestBpm>180)bestBpm=Math.round(bestBpm/2);
  return bestBpm;
}
function makeWaveData(buffer, width){
  const data=buffer.getChannelData(0), step=Math.ceil(data.length/width), peaks=[];
  for(let i=0;i<width;i++){
    let min=1,max=-1,start=i*step,end=Math.min(data.length,start+step);
    for(let j=start;j<end;j++){ const v=data[j]; if(v<min)min=v;if(v>max)max=v; }
    peaks.push([min,max]);
  }
  return peaks;
}
function drawWave(track, elapsed=0){
  const w=waveCanvas.width,h=waveCanvas.height; wctx.clearRect(0,0,w,h);
  wctx.fillStyle='rgba(255,255,255,.08)'; wctx.fillRect(0,0,w,h);
  if(!track||!track.wave){wctx.fillStyle='rgba(255,255,255,.35)';wctx.fillText('waveform loads after playback / BPM analysis',20,58);return;}
  const mid=h/2, ratio=track.duration?elapsed/track.duration:0;
  for(let x=0;x<track.wave.length;x++){
    const [min,max]=track.wave[x], played=x/track.wave.length<ratio;
    wctx.strokeStyle=played?'rgba(255,255,255,.95)':'rgba(255,255,255,.35)';
    wctx.beginPath(); wctx.moveTo(x,mid+min*mid*.9); wctx.lineTo(x,mid+max*mid*.9); wctx.stroke();
  }
  const px=clamp(ratio*w,0,w); wctx.strokeStyle='#ff1d2d'; wctx.lineWidth=3; wctx.beginPath();wctx.moveTo(px,0);wctx.lineTo(px,h);wctx.stroke(); wctx.lineWidth=1;
  const bpm=Number(track.bpm);
  if(bpm&&track.duration){
    const beatSec=60/bpm*4; // 小節線
    wctx.strokeStyle='rgba(255,29,45,.35)';
    for(let t=0;t<track.duration;t+=beatSec){const x=t/track.duration*w; wctx.beginPath();wctx.moveTo(x,0);wctx.lineTo(x,h);wctx.stroke();}
  }
}

document.addEventListener('keydown', async (e)=>{
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  const editing = tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA';
  if(editing && !['Escape','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(e.key)) return;

  const key = e.key.toLowerCase();

  if(e.code==='Space'){ e.preventDefault(); playBtn.click(); return; }
  if(e.key==='Tab'){ e.preventDefault(); toggleCleanMode(); return; }
  if(['1','2','3','4'].includes(e.key)){ e.preventDefault(); setNorikoVideoByNumber(e.key); return; }
  if(key==='a'){ e.preventDefault(); await seekRelative(-10); return; }
  if(key==='d'){ e.preventDefault(); await seekRelative(10); return; }
  if(key==='w'){ e.preventDefault(); if(tracks.length){ await ensureAudio(); forceNoCrossfade=true; await skipToPrev(true); } return; }
  if(key==='s'){ e.preventDefault(); if(tracks.length){ await ensureAudio(); forceNoCrossfade=true; await skipToNext(true); } return; }
  if(key==='m'){ e.preventDefault(); toggleMenu(); return; }
  if(key==='l'){ e.preventDefault(); vjBtn.click(); return; }
  if(key==='k'){ e.preventDefault(); shakeBtn.click(); return; }
  if(key==='f'){ e.preventDefault(); await toggleFullscreen(); return; }
  if(e.key==='Escape'){ if(document.fullscreenElement){ e.preventDefault(); await document.exitFullscreen().catch(()=>{}); } return; }

  if(e.key==='ArrowRight' || e.key==='ArrowDown'){ e.preventDefault(); moveKeyboardFocus(1); return; }
  if(e.key==='ArrowLeft' || e.key==='ArrowUp'){ e.preventDefault(); moveKeyboardFocus(-1); return; }
  if(e.key==='Enter'){ e.preventDefault(); await activateKeyboardFocus(); return; }
});

function updateAudioEnergy(){
  if(!analyser || !freqData || !isPlaying){
    bassEnergy *= .88;
    midEnergy *= .9;
    beatPulse *= .86;
    return;
  }

  analyser.getByteFrequencyData(freqData);

  let bass=0, mid=0;
  const bassBins = Math.min(12, freqData.length);
  const midStart = 14;
  const midEnd = Math.min(70, freqData.length);

  for(let i=1;i<bassBins;i++) bass += freqData[i];
  bass = bass / Math.max(1, bassBins-1) / 255;

  for(let i=midStart;i<midEnd;i++) mid += freqData[i];
  mid = mid / Math.max(1, midEnd-midStart) / 255;

  bassEnergy = bassEnergy * .72 + bass * .28;
  midEnergy = midEnergy * .78 + mid * .22;

  // 過去平均との差分を見る。「常時ドンドン」ではなく、アクセントだけ強く反応。
  bassHistory.push(bassEnergy);
  if(bassHistory.length > 90) bassHistory.shift();

  let avg = 0;
  for(const v of bassHistory) avg += v;
  avg /= Math.max(1, bassHistory.length);

  const accent = Math.max(0, bassEnergy - avg);

  const now = performance.now();
  const beatGap = getCurrentBeatGapMs();

  const threshold = .055;
  const minGap = beatGap ? beatGap * .62 : 260;

  if(accent > threshold && now - lastBeatAt > minGap){
    beatPulse = Math.min(1, accent * 7.5 + bassEnergy * .35);
    lastBeatAt = now;
  } else {
    beatPulse *= .84;
  }
}

function getCurrentBeatGapMs(){
  const t = tracks[currentIndex];
  const bpm = Number(t && t.bpm);
  if(!bpm || bpm < 40 || bpm > 240) return null;
  return 60000 / bpm;
}

function applyVideoShake(){
  if(!shakeEnabled || !isPlaying){
    bgVideo.style.transform = 'scale(1)';
    bgVideo.style.filter = '';
    return;
  }

  const intensity = Math.min(1, beatPulse * 1.1);
  if(intensity < .05){
    bgVideo.style.transform = 'scale(1)';
    bgVideo.style.filter = '';
    return;
  }

  const t = performance.now() / 1000;
  const scale = 1 + intensity * 0.012;
  const x = Math.sin(t * 92) * intensity * 1.6;
  const y = Math.cos(t * 77) * intensity * 1.2;
  bgVideo.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
  bgVideo.style.filter = `brightness(${1 + intensity * .06}) contrast(${1 + intensity * .045})`;
}


function drawLaserMode(w,h,amp){
  const laserAlpha = Math.min(.72, .16 + amp*.36 + beatPulse*.30);
  vctx.save();
  vctx.globalCompositeOperation = 'lighter';
  vctx.lineWidth = Math.max(1, w * 0.0022);

  for(let i=0;i<7;i++){
    const offset = (vjPhase*220 + i*w*.19) % (w*1.4) - w*.2;
    vctx.strokeStyle = i%2 ? `rgba(0,220,255,${laserAlpha})` : `rgba(255,30,80,${laserAlpha})`;
    vctx.beginPath();
    vctx.moveTo(offset, h*.12 + Math.sin(vjPhase+i)*h*.06);
    vctx.lineTo(offset + w*.42, h*.82 + Math.cos(vjPhase+i)*h*.08);
    vctx.stroke();
  }
  vctx.restore();
}

function drawSpotlightMode(w,h,amp){
  // 大きめの丸いカラースポットが下から上へ流れる演出。
  // 画面全体に乗せるので、存在感をかなり強めに。
  vctx.save();
  vctx.globalCompositeOperation = 'lighter';

  const colors = [
    [255,40,90],
    [0,180,255],
    [185,75,255],
    [255,210,70]
  ];

  for(let i=0;i<7;i++){
    const phase = (vjPhase*.22 + i*.74);
    const x = (Math.sin(phase*1.3) * .44 + .5) * w;
    const rise = (phase*0.085 + i*.137) % 1;
    const y = h * (1.18 - rise * 1.42);
    const radius = (0.22 + amp*.12 + (i%3)*.028) * Math.max(w,h);
    const [r,g,b] = colors[i%colors.length];
    const alpha = 0.20 + amp*.24 + beatPulse*.12;

    const grad = vctx.createRadialGradient(x,y,0,x,y,radius);
    grad.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
    grad.addColorStop(.32, `rgba(${r},${g},${b},${alpha*.45})`);
    grad.addColorStop(.72, `rgba(${r},${g},${b},${alpha*.12})`);
    grad.addColorStop(1,'rgba(0,0,0,0)');
    vctx.fillStyle = grad;
    vctx.beginPath();
    vctx.arc(x,y,radius,0,Math.PI*2);
    vctx.fill();
  }

  // フロア照明っぽい下部の色溜まり
  const floor = vctx.createLinearGradient(0,h*.62,0,h);
  floor.addColorStop(0,'rgba(0,0,0,0)');
  floor.addColorStop(.55,`rgba(255,40,100,${.08+amp*.12})`);
  floor.addColorStop(1,`rgba(0,160,255,${.10+amp*.16})`);
  vctx.fillStyle = floor;
  vctx.fillRect(0,0,w,h);

  vctx.restore();
}

function drawAmbientMode(w,h,amp){
  // 静かな場面でも「照明がいる」と分かる、ゆっくり漂う色面。
  vctx.save();
  vctx.globalCompositeOperation = 'lighter';

  const cx1 = (Math.sin(vjPhase*.5)*.35+.5)*w;
  const cy1 = (Math.cos(vjPhase*.35)*.25+.45)*h;
  const cx2 = (Math.cos(vjPhase*.42)*.35+.5)*w;
  const cy2 = (Math.sin(vjPhase*.31)*.25+.5)*h;

  const g1 = vctx.createRadialGradient(cx1,cy1,0,cx1,cy1,Math.max(w,h)*.58);
  g1.addColorStop(0, `rgba(255,40,105,${.12+amp*.12})`);
  g1.addColorStop(.55, `rgba(140,70,255,${.06+amp*.08})`);
  g1.addColorStop(1, 'rgba(0,0,0,0)');
  vctx.fillStyle = g1;
  vctx.fillRect(0,0,w,h);

  const g2 = vctx.createRadialGradient(cx2,cy2,0,cx2,cy2,Math.max(w,h)*.52);
  g2.addColorStop(0, `rgba(0,190,255,${.10+amp*.10})`);
  g2.addColorStop(.58, `rgba(0,90,255,${.05+amp*.07})`);
  g2.addColorStop(1, 'rgba(0,0,0,0)');
  vctx.fillStyle = g2;
  vctx.fillRect(0,0,w,h);

  vctx.restore();
}

function drawStrobeMode(w,h,amp){
  // チラつきだけでなく、白いライトバーが走る演出。
  vctx.save();
  vctx.globalCompositeOperation = 'lighter';

  const sweepX = ((vjPhase*180) % (w*1.4)) - w*.2;
  const barWidth = w*(.10 + amp*.06);
  const grad = vctx.createLinearGradient(sweepX,0,sweepX+barWidth,0);
  grad.addColorStop(0,'rgba(255,255,255,0)');
  grad.addColorStop(.5,`rgba(255,255,255,${.16+amp*.22})`);
  grad.addColorStop(1,'rgba(255,255,255,0)');
  vctx.fillStyle = grad;
  vctx.fillRect(sweepX,0,barWidth,h);

  if(beatPulse > .15){
    vctx.fillStyle = `rgba(255,255,255,${Math.min(.30,beatPulse*.26)})`;
    vctx.fillRect(0,0,w,h);
  }

  // 横方向の薄い光線
  vctx.strokeStyle = `rgba(0,220,255,${.12+amp*.18})`;
  vctx.lineWidth = Math.max(1,w*.002);
  for(let i=0;i<5;i++){
    const y = h*(.18+i*.15) + Math.sin(vjPhase+i)*h*.03;
    vctx.beginPath();
    vctx.moveTo(0,y);
    vctx.lineTo(w,y + Math.cos(vjPhase+i)*h*.04);
    vctx.stroke();
  }

  vctx.restore();
}

function drawMirrorDots(w,h,amp){
  // v2.6.2: 小さい飛び光は邪魔になりやすいため無効化。
  // 淡い大きな光だけを残す方針。
  return;
}

function drawVjLights(){
  resizeVjCanvas();
  updateAudioEnergy();
  applyVideoShake();

  const w = vjCanvas.width;
  const h = vjCanvas.height;

  vctx.clearRect(0,0,w,h);

  if(!vjEnabled || !isPlaying) return;

  const quietGate = Math.max(0, (bassEnergy + midEnergy) - .18);
  const amp = Math.min(1, quietGate * 2.25 + beatPulse * .95);

  if(amp < .018) return;

  vjPhase += 0.014 + amp * .016;

  // 長いスパンで照明モード変更
  const now = performance.now();
  if(now > nextVjSwitchAt){
    vjMode = (vjMode + 1) % 4;
    nextVjSwitchAt = now + 32000 + Math.random() * 24000;
  }

  // ベースフラッシュ
  if(beatPulse > .1){
    const flash = beatPulse * .16;
    const grad = vctx.createRadialGradient(w*.5,h*.48,0,w*.5,h*.48,Math.max(w,h)*.7);
    grad.addColorStop(0, `rgba(255,255,255,${flash})`);
    grad.addColorStop(.35, `rgba(255,30,60,${flash*.6})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    vctx.fillStyle = grad;
    vctx.fillRect(0,0,w,h);
  }

  switch(vjMode){
    case 0:
      drawLaserMode(w,h,amp);
      break;
    case 1:
      drawSpotlightMode(w,h,amp);
      break;
    case 2:
      drawAmbientMode(w,h,amp);
      break;
    case 3:
      drawStrobeMode(w,h,amp);
      break;
  }

  drawMirrorDots(w,h,amp);
}

function clearVj(){
  vctx.clearRect(0,0,vjCanvas.width,vjCanvas.height);
  bgVideo.style.transform='scale(1)';
  bgVideo.style.filter='';
}

function normalizeIndex(i){return tracks.length?(i+tracks.length)%tracks.length:-1;}
function clamp(v,min,max){return Math.max(min,Math.min(max,v));}
function formatTime(sec){if(!Number.isFinite(sec)||sec<0)sec=0;const m=Math.floor(sec/60),s=Math.floor(sec%60).toString().padStart(2,'0');return `${m}:${s}`;}
function esc(str){return String(str).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));}
</script>
